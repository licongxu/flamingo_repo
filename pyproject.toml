[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flamingo"
version = "0.1.0"
description = "General-purpose tools for processing FLAMINGO lightcone maps, catalogues, and pressure profiles."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Boris Bolliet" }]
dependencies = [
    "numpy>=1.24",
    "healpy>=1.16",
    "pandas>=2.0",
    "hmfast>=0.1",
    "jax>=0.4",
]

[project.optional-dependencies]
# Mask-decoupled power spectra rely on NaMaster (pymaster) and flat-sky stamps
# on pixell; both are heavy and installed separately. Everything else works
# without them.
powerspectra = ["pymaster>=1.5"]
stamps = ["pixell>=0.26"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
